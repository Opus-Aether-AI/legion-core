name: Legion core consumer update

on:
  workflow_call:
    inputs:
      version:
        description: Exact published legion-core version
        required: true
        type: string
      tag:
        description: Immutable legion-core release tag
        required: true
        type: string
      source_sha:
        description: Immutable legion-core release commit
        required: true
        type: string
      update_command:
        description: Optional repository-owned dependency or metadata update
        required: false
        default: ""
        type: string
      validation_command:
        description: Optional repository-owned validation after the update
        required: false
        default: ""
        type: string
      bun_version:
        description: Optional exact Bun version required by the consumer
        required: false
        default: ""
        type: string
      python_version:
        description: Optional exact Python version required by the consumer
        required: false
        default: ""
        type: string
      use_uv:
        description: Install uv for a Python consumer
        required: false
        default: false
        type: boolean
    outputs:
      disposition:
        description: Latest-wins disposition for the dispatched release
        value: ${{ jobs.update.outputs.disposition }}
      receipt:
        description: JSON receipt for the latest-wins decision
        value: ${{ jobs.update.outputs.receipt }}

# A called workflow's permissions cannot exceed the caller's. Requesting a
# scope no caller grants (packages: read) makes every consumer fail at startup
# with "workflow file issue" and no job at all -- strictly worse than the E401
# it was meant to fix. A consumer that scopes @opus-aether-ai to GitHub
# Packages must grant packages: read in ITS OWN caller workflow; this workflow
# forwards the token it is given and cannot widen it.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: legion-core-consumer-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    name: Open legion-core update PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      disposition: ${{ steps.arbitrate.outputs.disposition }}
      receipt: ${{ steps.arbitrate.outputs.receipt }}
    env:
      LEGION_CORE_VERSION: ${{ inputs.version }}
      LEGION_CORE_TAG: ${{ inputs.tag }}
      LEGION_CORE_SHA: ${{ inputs.source_sha }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UPDATE_BRANCH: chore/legion-core-latest
      UPDATE_COMMAND: ${{ inputs.update_command }}
      VALIDATION_COMMAND: ${{ inputs.validation_command }}
      GH_TOKEN: ${{ github.token }}
      # Consumers whose .npmrc scopes @opus-aether-ai to GitHub Packages
      # authenticate with a shell-expanded ${GITHUB_TOKEN}/${NODE_AUTH_TOKEN}.
      # Job-level on purpose: `npx --package @opus-aether-ai/legion-core` runs in
      # TWO steps (apply policy, then validate). Setting the token on only the
      # second one still failed at the first, which is exactly what happened.
      # A consumer must ALSO grant `packages: read` in its own caller workflow --
      # a called workflow cannot widen its caller's permissions. Consumers on the
      # public registry are unaffected: npm only sends a token to the host its
      # .npmrc scopes it to.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Refresh the queued run to the latest default branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          git checkout --detach "refs/remotes/origin/$BASE_BRANCH"
          git reset --hard "refs/remotes/origin/$BASE_BRANCH"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ inputs.bun_version != '' }}
        with:
          bun-version: ${{ inputs.bun_version }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ inputs.python_version != '' }}
        with:
          python-version: ${{ inputs.python_version }}

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: ${{ inputs.use_uv }}

      - name: Validate immutable release payload
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          [[ "$LEGION_CORE_VERSION" =~ $semver ]] || {
            echo "::error::invalid legion-core version: $LEGION_CORE_VERSION"
            exit 2
          }
          [ "$LEGION_CORE_TAG" = "v$LEGION_CORE_VERSION" ] || {
            echo "::error::tag $LEGION_CORE_TAG does not match version $LEGION_CORE_VERSION"
            exit 2
          }
          [[ "$LEGION_CORE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::invalid legion-core source SHA"
            exit 2
          }

      - name: Arbitrate the latest release
        id: arbitrate
        run: |
          set -euo pipefail

          semver_cmp() {
            node - "$1" "$2" <<'NODE'
          const parse = (raw) => {
            const match = raw.match(/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/);
            if (!match) throw new Error(`invalid semver: ${raw}`);
            return {
              core: [BigInt(match[1]), BigInt(match[2]), BigInt(match[3])],
              pre: match[4] === undefined ? null : match[4].split('.'),
            };
          };
          const compare = (left, right) => {
            for (let i = 0; i < 3; i += 1) {
              if (left.core[i] < right.core[i]) return -1;
              if (left.core[i] > right.core[i]) return 1;
            }
            if (left.pre === null && right.pre === null) return 0;
            if (left.pre === null) return 1;
            if (right.pre === null) return -1;
            const count = Math.max(left.pre.length, right.pre.length);
            for (let i = 0; i < count; i += 1) {
              if (left.pre[i] === undefined) return -1;
              if (right.pre[i] === undefined) return 1;
              const leftNumeric = /^[0-9]+$/.test(left.pre[i]);
              const rightNumeric = /^[0-9]+$/.test(right.pre[i]);
              if (leftNumeric && rightNumeric) {
                const a = BigInt(left.pre[i]);
                const b = BigInt(right.pre[i]);
                if (a < b) return -1;
                if (a > b) return 1;
              } else if (leftNumeric !== rightNumeric) {
                return leftNumeric ? -1 : 1;
              } else {
                if (left.pre[i] < right.pre[i]) return -1;
                if (left.pre[i] > right.pre[i]) return 1;
              }
            }
            return 0;
          };
          process.stdout.write(String(compare(parse(process.argv[2]), parse(process.argv[3]))));
          NODE
          }

          read_pin() {
            local ref="$1" label="$2" pin
            if ! pin="$(git show "$ref:.legion/legion-core.json" 2>/dev/null)"; then
              [ "$label" = "checked-in" ] && return 1
              echo "::error::$label candidate $ref has no .legion/legion-core.json" >&2
              return 2
            fi
            printf '%s' "$pin" | jq -e '
              .schema == "legion.core-pin.v1" and
              .package == "@opus-aether-ai/legion-core" and
              (.version | type == "string" and
                test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$")) and
              .tag == ("v" + .version) and
              (.source_sha | type == "string" and test("^[0-9a-f]{40}$"))' \
              >/dev/null || {
                echo "::error::$label Legion Core pin is malformed" >&2
                return 2
              }
            printf '%s' "$pin"
          }

          base_pin=''
          if git cat-file -e "HEAD:.legion/legion-core.json" 2>/dev/null; then
            base_pin="$(read_pin HEAD checked-in)"
          fi

          remote_sha="$(git ls-remote origin "refs/heads/$UPDATE_BRANCH" | awk 'NR == 1 {print $1}')"
          candidate_pin=''
          if [ -n "$remote_sha" ]; then
            git fetch --no-tags origin "$remote_sha"
            candidate_pin="$(read_pin "$remote_sha" stable)"
          fi

          authoritative_kind=none
          authoritative_pin=''
          candidate_is_stale=false
          if [ -n "$base_pin" ]; then
            authoritative_kind=checked_in
            authoritative_pin="$base_pin"
          fi
          if [ -n "$candidate_pin" ]; then
            if [ -z "$authoritative_pin" ]; then
              authoritative_kind=candidate
              authoritative_pin="$candidate_pin"
            else
              base_version="$(printf '%s' "$base_pin" | jq -r .version)"
              candidate_version="$(printf '%s' "$candidate_pin" | jq -r .version)"
              comparison="$(semver_cmp "$candidate_version" "$base_version")"
              if [ "$comparison" -gt 0 ]; then
                authoritative_kind=candidate
                authoritative_pin="$candidate_pin"
              elif [ "$comparison" -lt 0 ]; then
                candidate_is_stale=true
              elif [ "$comparison" -eq 0 ] && \
                   ! diff -u \
                     <(printf '%s' "$base_pin" | jq -S '{version,tag,source_sha}') \
                     <(printf '%s' "$candidate_pin" | jq -S '{version,tag,source_sha}') \
                     >/dev/null; then
                receipt="$(jq -cn \
                  --arg status identity_conflict \
                  --arg incoming "$LEGION_CORE_VERSION" \
                  --arg checked_in "$base_version" \
                  --arg candidate "$candidate_version" \
                  '{schema:"legion.core-consumer-update.v1",status:$status,
                    incoming_version:$incoming,checked_in_version:$checked_in,
                    candidate_version:$candidate}')"
                printf 'disposition=identity_conflict\nreceipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
                printf '### Legion Core update receipt\n\n~~~json\n%s\n~~~\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::checked-in and stable-candidate pins disagree at version $base_version"
                exit 1
              fi
            fi
          fi

          mode=apply
          disposition=update_required
          current_version=''
          if [ -n "$authoritative_pin" ]; then
            current_version="$(printf '%s' "$authoritative_pin" | jq -r .version)"
            comparison="$(semver_cmp "$LEGION_CORE_VERSION" "$current_version")"
            if [ "$comparison" -lt 0 ]; then
              mode=skip
              disposition=superseded
            elif [ "$comparison" -eq 0 ]; then
              if ! printf '%s' "$authoritative_pin" | jq -e \
                --arg version "$LEGION_CORE_VERSION" \
                --arg tag "$LEGION_CORE_TAG" \
                --arg source_sha "$LEGION_CORE_SHA" \
                '.version == $version and .tag == $tag and .source_sha == $source_sha' \
                >/dev/null; then
                receipt="$(jq -cn \
                  --arg status identity_conflict \
                  --arg incoming "$LEGION_CORE_VERSION" \
                  --arg current "$current_version" \
                  '{schema:"legion.core-consumer-update.v1",status:$status,
                    incoming_version:$incoming,current_version:$current}')"
                printf 'disposition=identity_conflict\nreceipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
                printf '### Legion Core update receipt\n\n~~~json\n%s\n~~~\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::release identity conflicts with immutable version $current_version"
                exit 1
              fi
              disposition=already_current
              if [ "$authoritative_kind" = candidate ]; then
                mode=replay
              else
                mode=skip
              fi
            fi
          fi

          retire_candidate=false
          if [ "$disposition" = superseded ] && [ "$candidate_is_stale" = true ] && \
             [ -n "$remote_sha" ]; then
            retire_candidate=true
          fi
          receipt="$(jq -cn \
            --arg status "$disposition" \
            --arg mode "$mode" \
            --arg incoming "$LEGION_CORE_VERSION" \
            --arg current "$current_version" \
            --arg branch "$UPDATE_BRANCH" \
            --arg remote_sha "$remote_sha" \
            --argjson retire_candidate "$retire_candidate" \
            '{schema:"legion.core-consumer-update.v1",status:$status,mode:$mode,
              incoming_version:$incoming,
              current_version:(if $current == "" then null else $current end),
              branch:$branch,
              candidate_sha:(if $remote_sha == "" then null else $remote_sha end),
              retire_candidate:$retire_candidate}')"
          printf 'mode=%s\ndisposition=%s\nremote_sha=%s\nretire_candidate=%s\nreceipt=%s\n' \
            "$mode" "$disposition" "$remote_sha" "$retire_candidate" "$receipt" >> "$GITHUB_OUTPUT"
          printf '### Legion Core update receipt\n\n~~~json\n%s\n~~~\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"

      - name: Retire a superseded stable candidate
        if: ${{ steps.arbitrate.outputs.retire_candidate == 'true' }}
        env:
          EXPECTED_REMOTE_SHA: ${{ steps.arbitrate.outputs.remote_sha }}
        run: |
          set -euo pipefail
          branch="$UPDATE_BRANCH"
          actual_remote="$(git ls-remote origin "refs/heads/$branch" | awk 'NR == 1 {print $1}')"
          [ -n "$EXPECTED_REMOTE_SHA" ] && [ "$actual_remote" = "$EXPECTED_REMOTE_SHA" ] || {
            echo "::error::stale stable candidate moved before retirement; retry against the new head"
            exit 1
          }

          pulls="$(gh pr list --state open --head "$branch" --base "$BASE_BRANCH" \
            --limit 2 --json number,isDraft,headRefOid,baseRefName)"
          count="$(jq -r 'if type == "array" then length else error("not an array") end' <<<"$pulls")"
          [ "$count" -le 1 ] || {
            echo "::error::multiple open PRs target the stable update branch; refusing ambiguous retirement"
            exit 1
          }
          pr_number=''
          if [ "$count" -eq 1 ]; then
            printf '%s' "$pulls" | jq -e --arg head "$EXPECTED_REMOTE_SHA" \
              --arg base "$BASE_BRANCH" \
              '.[0].isDraft == true and .[0].headRefOid == $head and
               .[0].baseRefName == $base' >/dev/null || {
                echo "::error::stable update PR is not a draft at the exact stale candidate head and base"
                exit 1
              }
            pr_number="$(printf '%s' "$pulls" | jq -r '.[0].number')"
          fi

          git push --force-with-lease="refs/heads/$branch:$EXPECTED_REMOTE_SHA" origin \
            ":refs/heads/$branch"
          if [ -n "$pr_number" ]; then
            state="$(gh pr view "$pr_number" --json state --jq .state)"
            if [ "$state" = OPEN ]; then
              gh pr close "$pr_number" \
                --comment "Closing this draft because the checked-in Legion Core baseline is newer than its candidate."
            elif [ "$state" != CLOSED ]; then
              echo "::error::stable update PR entered unexpected state $state during retirement"
              exit 1
            fi
            [ "$(gh pr view "$pr_number" --json state --jq .state)" = CLOSED ] || {
              echo "::error::stale stable update PR was not closed"
              exit 1
            }
          fi

      - name: Prepare the stable candidate branch
        if: ${{ steps.arbitrate.outputs.mode != 'skip' }}
        env:
          UPDATE_MODE: ${{ steps.arbitrate.outputs.mode }}
          REMOTE_SHA: ${{ steps.arbitrate.outputs.remote_sha }}
        run: |
          set -euo pipefail
          if [ "$UPDATE_MODE" = replay ]; then
            [ -n "$REMOTE_SHA" ] || {
              echo "::error::replay requested without a stable candidate SHA"
              exit 1
            }
            git checkout -B "$UPDATE_BRANCH" "$REMOTE_SHA"
          else
            git checkout -B "$UPDATE_BRANCH"
          fi

      - name: Apply the published Legion policy
        if: ${{ steps.arbitrate.outputs.mode == 'apply' }}
        run: |
          npx --yes --@opus-aether-ai:registry=https://registry.npmjs.org \
            --package "@opus-aether-ai/legion-core@$LEGION_CORE_VERSION" \
            legion-init --repo .

      - name: Record the repository core baseline
        if: ${{ steps.arbitrate.outputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          mkdir -p .legion
          temp="$(mktemp .legion/.legion-core.json.XXXXXX)"
          jq -n \
            --arg version "$LEGION_CORE_VERSION" \
            --arg tag "$LEGION_CORE_TAG" \
            --arg source_sha "$LEGION_CORE_SHA" \
            '{
              schema: "legion.core-pin.v1",
              package: "@opus-aether-ai/legion-core",
              version: $version,
              tag: $tag,
              source_sha: $source_sha
            }' > "$temp"
          mv "$temp" .legion/legion-core.json

      - name: Apply repository-specific dependency metadata
        if: ${{ steps.arbitrate.outputs.mode == 'apply' && inputs.update_command != '' }}
        run: bash -euo pipefail -c "$UPDATE_COMMAND"

      - name: Validate Legion policy and repository integration
        if: ${{ steps.arbitrate.outputs.mode != 'skip' }}
        run: |
          set -euo pipefail
          npx --yes --@opus-aether-ai:registry=https://registry.npmjs.org \
            --package "@opus-aether-ai/legion-core@$LEGION_CORE_VERSION" \
            legion-init --repo . --check
          jq -e \
            --arg version "$LEGION_CORE_VERSION" \
            --arg tag "$LEGION_CORE_TAG" \
            --arg source_sha "$LEGION_CORE_SHA" \
            '.schema == "legion.core-pin.v1"
             and .package == "@opus-aether-ai/legion-core"
             and .version == $version
             and .tag == $tag
             and .source_sha == $source_sha' \
            .legion/legion-core.json >/dev/null
          if [ -n "$VALIDATION_COMMAND" ]; then
            bash -euo pipefail -c "$VALIDATION_COMMAND"
          fi

      - name: Create or update the dependency PR
        if: ${{ steps.arbitrate.outputs.mode != 'skip' }}
        env:
          UPDATE_MODE: ${{ steps.arbitrate.outputs.mode }}
          EXPECTED_REMOTE_SHA: ${{ steps.arbitrate.outputs.remote_sha }}
        run: |
          set -euo pipefail
          branch="$UPDATE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$UPDATE_MODE" = apply ]; then
            [ -n "$(git status --porcelain)" ] || {
              echo "::error::latest-wins arbitration selected an update but produced no change"
              exit 1
            }
            git add -A
            git add -f .legion/legion-core.json
            git commit -m "chore(deps): update legion-core to $LEGION_CORE_VERSION"
            git push --force-with-lease="refs/heads/$branch:$EXPECTED_REMOTE_SHA" origin \
              "HEAD:refs/heads/$branch"
          else
            actual_remote="$(git ls-remote origin "refs/heads/$branch" | awk 'NR == 1 {print $1}')"
            [ "$actual_remote" = "$EXPECTED_REMOTE_SHA" ] || {
              echo "::error::stable candidate moved while replaying it; retry against the new head"
              exit 1
            }
          fi

          candidate_sha="$(git rev-parse HEAD)"
          actual_remote="$(git ls-remote origin "refs/heads/$branch" | awk 'NR == 1 {print $1}')"
          [ "$actual_remote" = "$candidate_sha" ] || {
            echo "::error::remote stable candidate does not match the locally validated head"
            exit 1
          }

          if [ -n "$VALIDATION_COMMAND" ]; then
            validation_line="- Repository-owned validation: completed successfully"
          else
            validation_line="- Repository-owned validation command: not configured (Legion policy and immutable pin checks only)"
          fi
          body="$(printf '%s\n\n%s\n%s\n%s\n%s' \
            "Automated Legion fleet update from $LEGION_CORE_TAG." \
            "- Package: @opus-aether-ai/legion-core@$LEGION_CORE_VERSION" \
            "- Release commit: $LEGION_CORE_SHA" \
            "- Policy: applied non-destructively with legion-init" \
            "$validation_line")"
          existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --title "chore(deps): update legion-core to $LEGION_CORE_VERSION" \
              --body "$body"
            if [ "$(gh pr view "$existing" --json isDraft --jq .isDraft)" != true ]; then
              gh pr ready "$existing" --undo
            fi
          else
            # The branch is already pushed at this point. If PR creation is
            # refused, say why in one actionable line: the raw GraphQL error
            # ("GitHub Actions is not permitted to create or approve pull
            # requests") is a repository/org setting, not a code fault, and
            # reading it out of a buried log has cost this fleet several
            # releases of silent drift.
            if ! create_error="$(gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --draft \
              --title "chore(deps): update legion-core to $LEGION_CORE_VERSION" \
              --body "$body" 2>&1)"; then
              printf '%s\n' "$create_error" >&2
              case "$create_error" in
                *"not permitted to create or approve pull requests"*)
                  echo "::error::Branch $branch was pushed, but this repository forbids GitHub Actions from opening pull requests. Enable Settings -> Actions -> General -> 'Allow GitHub Actions to create and approve pull requests', then re-run. The update branch is already available and can be opened manually in the meantime."
                  ;;
                *)
                  echo "::error::Branch $branch was pushed but the update pull request could not be opened. See the error above."
                  ;;
              esac
              exit 1
            fi
          fi

          pr="$(gh pr view "$branch" --json isDraft,headRefOid,baseRefName)"
          printf '%s' "$pr" | jq -e \
            --arg head "$candidate_sha" \
            --arg base "${{ github.event.repository.default_branch }}" \
            '.isDraft == true and .headRefOid == $head and .baseRefName == $base' \
            >/dev/null || {
              echo "::error::update PR is not a draft for the validated stable candidate"
              exit 1
            }
