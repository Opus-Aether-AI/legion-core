name: publish-package

# Manual escape hatch to (re)publish @opus-aether-ai/legion-core to npmjs and
# GitHub Packages from an explicit immutable release tag.
#
# The normal path is automatic: release-please.yml publishes when release-please
# cuts a release (gated on `release_created`). This workflow is dispatch-only for
# dry-runs, recovery, or re-pushes.
#
# This is an additive distribution channel: legion-core is still consumable as a
# Claude Code marketplace (`claude plugin marketplace add Opus-Aether-AI/legion-core`)
# and via a source clone.
#
# Auth: npmjs uses Trusted Publishing / GitHub OIDC. GitHub Packages uses
# GITHUB_TOKEN. Keep release-please.yml as the normal npmjs Trusted Publisher;
# real npm publishes from this workflow are only for recovery cases.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to publish (for example, v0.19.0)
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write

concurrency:
  group: publish-package-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: release
      url: https://www.npmjs.com/package/@opus-aether-ai/legion-core
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify immutable release tag and versions
        id: release_ref
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag must be a v-prefixed semantic version tag"
            exit 1
          fi
          git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          if [ "$tag_sha" != "$head_sha" ]; then
            echo "::error::${RELEASE_TAG} resolves to ${tag_sha}, not checked-out ${head_sha}"
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          pkg="$(jq -r '.version' package.json)"
          marketplace="$(jq -r '.version' .claude-plugin/marketplace.json)"
          if [ "$tag_version" != "$pkg" ] || [ "$tag_version" != "$marketplace" ]; then
            echo "::error::${RELEASE_TAG} must match package.json (${pkg}) and marketplace.json (${marketplace})"
            exit 1
          fi
          {
            echo "sha=${head_sha}"
            echo "package=$(jq -r '.name' package.json)"
            echo "version=${tag_version}"
          } >> "$GITHUB_OUTPUT"
          echo "${RELEASE_TAG} resolves to ${head_sha}; versions are in sync"

      - name: Require validate + legion-ci green for release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.release_ref.outputs.sha }}
        run: scripts/await-required-workflows.sh validate legion-ci

      # Keep the public release installer independently recoverable. A rerun is
      # idempotent and replaces only this exact tag's validated installer asset.
      - name: Attach installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" scripts/install.sh --clobber

      - name: Set up Node for npmjs.com
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use pinned npm
        run: npm install -g npm@12.0.2

      - name: Publish to npm with provenance
        env:
          PACKAGE_NAME: ${{ steps.release_ref.outputs.package }}
          PACKAGE_VERSION: ${{ steps.release_ref.outputs.version }}
        run: |
          set -euo pipefail
          published="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$published" = "$PACKAGE_VERSION" ]; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npmjs; skipping."
          else
            npm publish --provenance --access public --ignore-scripts --tag latest
          fi

      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@opus-aether-ai'
          package-manager-cache: false

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ steps.release_ref.outputs.package }}
          PACKAGE_VERSION: ${{ steps.release_ref.outputs.version }}
        run: |
          set -euo pipefail
          published="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com 2>/dev/null || true)"
          if [ "$published" = "$PACKAGE_VERSION" ]; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on GitHub Packages; skipping."
          else
            npm publish --registry=https://npm.pkg.github.com --ignore-scripts
          fi
