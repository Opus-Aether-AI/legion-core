# Legion model catalog.
#
# Each key is a semantic MODEL ROLE that route policy (routing.toml) references
# by name. Repoint a role at any provider model ID to switch a whole class of
# tasks in one line; add roles as new tiers/providers show up. Routing should
# reference these role keys, never a raw model ID, so a model swap lives here.
#
# Catalog policy: Anthropic Opus + Fable, OpenAI GPT-5.6 + GPT-6/6.1, xAI Grok,
# DeepSeek -- natively and, as the cheap executor, through OpenRouter on opencode.
# Sonnet 5.5 and Haiku 5.5 are priced in costs.json (spans from them are metered
# correctly) but no role points at them; other cheap families (GLM, Kimi, Qwen)
# stay out until the paired benchmark in issue #218 justifies them. DeepSeek entered the catalog with the DeepSeek Harness executor -- an
# executor needs a model role, so adding the harness necessarily widened this
# allowlist. It is reachable only by asking for that executor: no archetype
# routes to it. Every Claude role runs on CLAUDE CODE (the `claude` executor),
# never piped through Cursor.
#
# TIERS. The catalog separates capability and workload fit from token prices.
# Evaluate each role on accepted results and total cost, including rework:
#
#   frontier   Fable 5.2 / GPT-6 Astra. Reserved for the hard end -- deep bugs,
#              perf work, adversarial security review, frontend craft. Routed by
#              a small, named set of archetypes, never by the bulk lanes.
#   precision  GPT-6.1 Sol. Standard input matches Terra; output is $10/M
#              versus Terra's $12/M, with $0.10/M cache reads and $2.50/M writes.
#              Above 272K prompt tokens, input/cache rates double and output
#              rises 1.5x. Used for high-rework-risk work and technical review.
#   workhorse  Opus 5.5 / gpt-5.6-terra / Grok 4.6. Carries the volume: scoped
#              implementation, tests, refactors, routine review.
#   cheap      gpt-5.6-luna / OpenRouter DeepSeek V4.1 Flash. Bounded,
#              mechanical, reversible work only.
#
# Adding a frontier role is cheap; ROUTING one is not. Move an archetype to the
# frontier tier only with a measured reason, and record it in routing.toml's note.
#
# The frontend polish/review split is REAL again: `frontend-polish` runs on
# claude_frontier (Fable 5.2) and `frontend-review` on claude_default (Opus 5.5),
# so the reviewer is a genuinely different model from the author. Cursor hosts
# ONLY its native non-Claude models (Grok + Composer, kept available).
#
# EFFORT: Claude roles run at `high` for judgement. Codex roles are tiered: low/medium
# for bounded work, high for scoped implementation, max only for hard or
# persistent slices. Astra accepts low..xhigh on Chat Completions and `max` on the
# Responses API -- Codex CLI uses Responses, so `max` is reachable (verified
# against codex-cli 0.153.4). Grok tops out at `high`.
# The effort per archetype lives in routing.toml.
#
# CURRENCY. `legion-models check` compares every id here with the provider's
# published model list (models.dev for Anthropic, OpenAI, DeepSeek and xAI; the
# OpenRouter catalogue for openrouter/ ids). The daily refresh runs it and
# legion-doctor reports the result, so a retired id cannot sit here silently.
# Last reviewed 2026-11-20.

[models]
# ── FRONTIER tier — the hard end only; see the tier note above ──────────
claude_frontier     = "claude-fable-5-2"  # frontend polish + opt-in high-stakes final review
codex_frontier      = "gpt-6-astra"       # hard bugs, perf work, adversarial security review

# ── Anthropic Claude on CLAUDE CODE (the `claude` executor / self) ──
claude_orchestrator = "claude-opus-5-5"  # self: orchestration / architecture / deep reasoning (run at high)
claude_default      = "claude-opus-5-5"  # generic Claude / reverse-delegate target / frontend review

# TODO(model-currency): newer OpenAI ids are published (GPT-6.2 Sol/Astra,
# GPT-6.1 Terra). Migrate the Codex roles only once Codex is logged in again and
# a paired run shows the new id is accepted by the installed codex CLI; the ids
# below are still in OpenAI's list.
# ── OpenAI GPT-6.1 Sol (Codex) — precision implementation + review ──
codex_precision     = "gpt-6.1-sol"      # high-rework-risk implementation where fewer passes can lower total cost
codex_review        = "gpt-6.1-sol"      # routine technical second opinion; the default codex reviewer

# ── OpenAI GPT-5.6 (Codex) — the workhorse lane ────────────────────
codex_workhorse     = "gpt-5.6-terra"    # persistent scoped implementation
codex_cheap         = "gpt-5.6-luna"     # bounded search, boilerplate, mechanical edits
codex_default       = "gpt-5.6-terra"    # generic Codex

# ── Cursor harness roles (Cursor-native models ONLY; effort encoded in the id) ──
# Grok 4.6 for independent second-opinion / tie-break (a different lineage than
# the configured Claude and Codex roles). Cursor never hosts Claude models — those run on
# Claude Code (claude_frontier / claude_default above).
# TODO(model-currency): Cursor publishes no machine-readable model list and its
# CLI is not installed on the machine this was reviewed on, so these two ids are
# unverified; `legion-models check` reports them as unverifiable.
cursor_default      = "cursor-grok-4.6-high"          # Grok's ceiling (no xhigh)
cursor_composer     = "composer-2.5"                  # Cursor in-house; kept available but UNROUTED (no archetype)

# ── opencode on OpenRouter — the cheap executor ──
# opencode reaches OpenRouter with OPENROUTER_API_KEY, which legion-opencode
# reads from a key file (LEGION_OPENROUTER_KEY_FILE, default
# ~/.config/legion/openrouter.key). Without the file the executor is reported
# unavailable and the router skips it; legion-doctor names the exact path.
# Explicit --executor opencode only until the paired benchmark (issue #218,
# step 7) shows it holds quality; no archetype routes here yet.
opencode_default    = "openrouter/deepseek/deepseek-v4.1-flash"  # cheap bulk lane: search, boilerplate, mechanical edits
opencode_review     = "openrouter/deepseek/deepseek-v4-pro"      # cross-family reviewer in the [review] order

# ── symmetric harness defaults (explicit targets; no default archetype routes) ──
# DeepSeek Harness. dsh is a developer preview that publishes no headless
# model-name contract, so this is the vendor's own current coding model and
# is expected to move; it is a ROLE like every other entry, so changing it
# here is the only edit required.
# TODO(model-currency): the id is current in DeepSeek's API list, but dsh has
# never run here, so whether dsh accepts it is unverified.
deepseek_default    = "deepseek-v4-pro"
# TODO(model-currency): Hermes and Pi have not run here; their ids are current
# in OpenAI's list but untested through those harnesses.
hermes_default      = "gpt-5.6-terra"
pi_default          = "gpt-5.6-terra"
