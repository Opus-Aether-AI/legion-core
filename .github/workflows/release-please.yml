name: release-please

# Single-workflow release pipeline, matching @opus-aether-ai/pine-transpiler:
#  1. release-please opens or updates a Release PR on pushes to main.
#  2. The Release PR is flagged for GitHub-native auto-merge.
#  3. When that Release PR lands, release-please creates the tag + Release and
#     this same workflow publishes @opus-aether-ai/legion-core to npmjs and
#     GitHub Packages.
#
# The publish step lives in this workflow because GitHub does not trigger
# downstream workflows from tags/releases created by the default GITHUB_TOKEN.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write
  # Needed by await-checks to read other workflows' runs for this commit. A
  # workflow-level `permissions:` block zeroes every scope it does not list, so
  # this must be explicit even though the repo default would allow it.
  actions: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: New main commits are release-compatible
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          range="${BEFORE_SHA}..${AFTER_SHA}"
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            range="${AFTER_SHA}"
          fi

          while IFS= read -r title; do
            scripts/validate-conventional-title.sh "${title}"
          done < <(git log --format=%s --reverse "${range}")

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Enable auto-merge on Release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          pr_number="$(jq -r '.number // empty' <<<"${RELEASE_PR}")"
          if [ -z "${pr_number}" ]; then
            echo "::error::release-please output did not include a PR number"
            exit 1
          fi
          echo "Enabling auto-merge on Release PR #${pr_number}"
          gh pr merge "${pr_number}" --repo "${REPO}" --auto --squash

  # Release PRs are opened by release-please using the default GITHUB_TOKEN, and
  # GitHub does not trigger workflows for such PRs — their `validate` / `legion-ci`
  # runs sit at `action_required` and never execute. v0.18.1 therefore merged and
  # published with no CI having run on it. Nothing was broken, but the gate was
  # absent.
  #
  # `needs:` cannot reference another workflow, so this job waits for validate and
  # legion-ci to conclude on THIS commit (they start from the same push) and
  # blocks the publish until they are green.
  #
  # It fails closed. A required workflow that is missing, still running at the
  # deadline, cancelled or skipped all count as "not green" — absence is never
  # read as success, which would silently reopen the hole this job exists to fix.
  await-checks:
    name: Await required checks
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require validate + legion-ci green on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required="validate legion-ci"
          deadline=$(( SECONDS + 1500 ))

          while :; do
            runs="$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs[] | [.name, .status, (.conclusion // "-")] | @tsv')"

            pending=""
            for wf in $required; do
              line="$(printf '%s\n' "$runs" | awk -F'\t' -v w="$wf" '$1 == w { print; exit }')"

              if [ -z "$line" ]; then
                pending="${pending} ${wf}(not-started)"
                continue
              fi

              status="$(printf '%s' "$line" | cut -f2)"
              conclusion="$(printf '%s' "$line" | cut -f3)"

              if [ "$status" != "completed" ]; then
                pending="${pending} ${wf}(${status})"
                continue
              fi

              if [ "$conclusion" != "success" ]; then
                echo "::error::${wf} concluded '${conclusion}' for ${SHA} — refusing to publish"
                exit 1
              fi

              echo "green: ${wf}"
            done

            [ -z "$pending" ] && break

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for:${pending} — refusing to publish"
              exit 1
            fi

            echo "waiting for:${pending}"
            sleep 20
          done

          echo "all required checks green for ${SHA}"

  publish:
    name: Publish package
    needs: [release-please, await-checks]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://www.npmjs.com/package/@opus-aether-ai/legion-core
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Node for npmjs.com
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use latest npm
        run: npm install -g npm@latest

      - name: Version is in sync
        run: |
          set -euo pipefail
          tag_version="${{ needs.release-please.outputs.version }}"
          pkg="$(jq -r '.version' package.json)"
          mkt="$(jq -r '.version' .claude-plugin/marketplace.json)"
          if [ "$tag_version" != "$pkg" ]; then
            echo "::error::Tag v${tag_version} does not match package.json ${pkg}"
            exit 1
          fi
          if [ "$pkg" != "$mkt" ]; then
            echo "::error::package.json ($pkg) != marketplace.json ($mkt)"
            exit 1
          fi
          echo "version $pkg in sync"

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --ignore-scripts --tag latest

      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@opus-aether-ai'
          package-manager-cache: false

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Serve the installer from the release so `releases/latest/download/install.sh`
      # always resolves to the released (immutable) script, not main HEAD.
      - name: Attach installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" scripts/install.sh --clobber
