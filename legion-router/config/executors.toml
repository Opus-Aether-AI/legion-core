# Hermes and Pi use first-class diff adapters. Both create Legion-owned
# worktrees and terminal artifacts; unsupported sandbox modes fail closed.
[executors.deepseek]
acp = false
task_file = false
binary = "dsh"
version_args = ["--version"]
version_policy = "open"
supported_version_patterns = []
known_bad_version_patterns = []
config_fingerprint_env = ["LEGION_DSH_PROFILE", "DSH_PROFILE"]
config_fingerprint_files = []
required_config_env = []
supported_config_env = []
known_bad_config_env = []
supported_sandboxes = ["workspace-write"]
supported_read_modes = ["provider-tools"]
supported_task_transports = ["argv"]
# The profile chooses the model and dsh-headless exposes no observable model
# selection contract.  An adapter-level --model would therefore be cosmetic;
# reject every requested override until the effective selection is observable.
supported_model_patterns = []
supported_efforts = []
billing_class = "metered"
requires_explicit_consent = false
explicit_consent_model_patterns = []
usage_reliability = "unavailable"
usage_source = "none"
cost_reliability = "unavailable"
cost_source = "none"
cancellation = "process_tree"
max_runtime_seconds = 3600
# review = "none": dsh publishes no structured verdict path, so it must not sit
# in the review fallback order where a reviewer that cannot produce a schema-
# valid verdict looks like a reviewer that rejected the change.
review = "none"
review_model_ref = ""
kind = "primary coding"
adapter = "legion-deepseek"
contract = "diff"
model_ref = "deepseek_default"

