# Legion executor registry — the harnesses Legion can run work through.
#
# Legion is harness-SYMMETRIC: any executor whose `kind` includes "primary" can
# be the operator's PRIMARY harness (the one driving the session) and delegate
# scoped work to any *coding* executor via
#
#   legion-delegate run --executor <name> --task "…"
#
# `self` in routing.toml is not listed here — it is a sentinel meaning "whoever
# is primary does this inline" and resolves to `legion-route --primary`.
#
# Fields:
#   kind      space-separated capabilities:
#               primary — can drive a session and delegate to others
#               coding  — can be handed a scoped task and return a result/diff
#   adapter   CLI implementing the Legion runner contract
#             (`<adapter> run --repo … --task … [--model …] …`). Empty for
#             primary-only executors that produce no code diff.
#   contract  the adapter's I/O shape, consumed by legion-delegate's dispatcher:
#               native — handled inline by legion-delegate itself (codex)
#               diff   — worktree + diff producer, full arg set
#                        (--archetype/--model/--sandbox/--base/--apply/--keep)
#               prompt — prompt executor, returns text; args: --task/--model/--repo
#               ""     — primary-only, no coding adapter
#   model_ref default model role (see models.toml); empty for primary-only.
#   acp       true when this executor can be driven over the Agent Client
#             Protocol instead of its bespoke adapter. Every executor here is in
#             the ACP registry, so one client reaches all of them -- and the
#             thirty-odd agents Legion has never integrated -- through one wire.
#             Opt-in per executor: the bespoke adapters stay authoritative until
#             an executor has been exercised over ACP, because a protocol both
#             sides implement is not the same as a protocol both sides implement
#             the same way.
#   task_file true when the adapter accepts `--task-file PATH`. The task can
#             exceed ARG_MAX once a diff or long spec is in it, so the
#             dispatcher hands it over out of band. Declared rather than
#             probed: probing means executing the adapter an extra time.
#   review    how this executor can produce a code review:
#               native — has a first-class review subcommand with schema output
#                        (codex: `codex exec review --output-schema`)
#               prompt — reviews via an ordinary delegated prompt, normalized
#                        into the verdict schema by normalize-review-verdict.py
#               none   — cannot review; skipped by the review fallback order
#   review_model_ref  model role used when THIS executor reviews.

[executors.claude]
acp = false
task_file = true
review = "prompt"
# Every Claude role is Opus, so this is now the SAME model as
# the primary -- a second pass, not an independent opinion. That is why claude
# stays LAST in [review].order: it is the reviewer of last resort, for when codex,
# cursor and opencode are all unavailable. Genuine cross-model review comes from
# those, not from here.
review_model_ref = "claude_opus"
kind = "primary coding"
adapter = "legion-claude"
contract = "diff"
model_ref = "claude_default"

[executors.codex]
acp = false
task_file = true
review = "native"
review_model_ref = "codex_review"
kind = "primary coding"
adapter = "legion-delegate"
contract = "native"
model_ref = "codex_workhorse"

[executors.cursor]
acp = false
task_file = true
review = "prompt"
review_model_ref = "cursor_default"
kind = "primary coding"
adapter = "legion-cursor"
contract = "diff"
model_ref = "cursor_default"

[executors.opencode]
acp = false
task_file = true
review = "prompt"
review_model_ref = "opencode_review"
kind = "primary coding"
adapter = "legion-opencode"
contract = "diff"
model_ref = "opencode_default"

# Hermes and Pi use first-class diff adapters. Both create Legion-owned
# worktrees and terminal artifacts; unsupported sandbox modes fail closed.
[executors.deepseek]
acp = false
task_file = true
# review = "none": dsh publishes no structured verdict path, so it must not sit
# in the review fallback order where a reviewer that cannot produce a schema-
# valid verdict looks like a reviewer that rejected the change.
review = "none"
review_model_ref = ""
kind = "primary coding"
adapter = "legion-deepseek"
contract = "diff"
model_ref = "deepseek_default"

[executors.hermes]
acp = false
task_file = true
review = "none"
kind = "primary coding"
adapter = "legion-hermes"
contract = "diff"
model_ref = "hermes_default"

[executors.pi]
acp = false
task_file = true
review = "none"
kind = "primary coding"
adapter = "legion-pi"
contract = "diff"
model_ref = "pi_default"
