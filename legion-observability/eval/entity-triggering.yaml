# Entity-level trigger scorecard for legion-core's self-learning loop.
#
# Calibrated to the legion-core entity surface — the legion-* skills. legion-core
# ships no slash commands or sub-agents of its own (domain agents add those), so
# every case here is a skill. Extend with command/agent cases when you build on top.
cases:
  - prompt: "Under Codex CLI, map Codex-native MCPs and bridged commands, then decide whether architecture judgement, frontend polish, or independent review stays inline or uses a configured role"
    expect_type: skill
    expect: legion-codex-mode
    why: Codex-primary role-driven routing is the legion-codex-mode skill

  - prompt: "DeepSeek Harness is driving Legion; explain the required dsh headless profile, no-review limitation, and usage-not-reported contract"
    expect_type: skill
    expect: legion-deepseek-mode
    why: DeepSeek-primary adapter limits and routing belong to legion-deepseek-mode

  - prompt: "Show Legion telemetry, per-executor cost, latency, spans, doctor, and self-learning hints"
    expect_type: skill
    expect: legion-observability
    why: observability telemetry and self-learning hints belong to the observability skill

  - prompt: "Delegate a scoped task to the configured Codex or Cursor role in an isolated worktree and return a verified diff"
    expect_type: skill
    expect: legion-router
    why: scoped model delegation with a verified diff is the router

  - prompt: "Orchestrate the whole goal across models: fan out implementation, cross-verify, then synthesize"
    expect_type: skill
    expect: legion-orchestrate
    why: whole-goal fan-out + cross-verify + synthesize is the orchestrator

  - prompt: "Run a major coding task through the legion-run lifecycle with a plan file, validate command, HTML evidence, and validation-led memory"
    expect_type: skill
    expect: legion-run
    why: heavy-task execution through plan/validate/report/learn is the legion-run skill

  - prompt: "Install and update the marketplace and wire the Codex and Cursor bridges"
    expect_type: skill
    expect: legion-setup
    why: install/update + cross-harness bridges is the setup skill
