name: release-please

# Single-workflow release pipeline, matching @opus-aether-ai/pine-transpiler:
#  1. release-please opens or updates a Release PR on pushes to main.
#  2. The Release PR is flagged for GitHub-native auto-merge.
#  3. When that Release PR lands, release-please creates the tag + Release and
#     this same workflow publishes @opus-aether-ai/legion-core to npmjs and
#     GitHub Packages.
#
# The publish step lives in this workflow because GitHub does not trigger
# downstream workflows from tags/releases created by the default GITHUB_TOKEN.

on:
  push:
    branches:
      - main
  # npmjs Trusted Publishing is bound to this workflow file. Keep recovery in
  # the same workflow so a manual rerun receives the configured OIDC identity.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to recover (for example, v0.19.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write
  # Needed by await-checks to read other workflows' runs for this commit. A
  # workflow-level `permissions:` block zeroes every scope it does not list, so
  # this must be explicit even though the repo default would allow it.
  actions: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # `needs:` cannot reference another workflow. Run this first so the
  # release-please action cannot create a tag or GitHub Release until the two
  # main-push workflows for this exact commit have succeeded. The helper only
  # receives those other workflow names, so it never waits on this workflow.
  await-checks:
    name: Await required checks
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Require validate + legion-ci green on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/await-required-workflows.sh validate legion-ci

  release-please:
    needs: await-checks
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.pending_release.outputs.pending }}
      tag_name: ${{ steps.pending_release.outputs.tag_name }}
      version: ${{ steps.pending_release.outputs.version }}
      release_sha: ${{ steps.pending_release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: New main commits are release-compatible
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          range="${BEFORE_SHA}..${AFTER_SHA}"
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            range="${AFTER_SHA}"
          fi

          while IFS= read -r title; do
            scripts/validate-conventional-title.sh "${title}"
          done < <(git log --format=%s --reverse "${range}")

      # The default Actions integration can open Release PRs but this repository
      # rejects its release-creation request. Use the installed, contents-only
      # release bot for that single mutation. The finder also repairs a merged
      # Release PR on the next main push if the original release attempt failed.
      - name: Identify a pending GitHub Release
        id: pending_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/prepare-pending-release.sh

      - name: Require checks on the pending release commit
        if: ${{ steps.pending_release.outputs.pending == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.pending_release.outputs.release_sha }}
        run: scripts/await-required-workflows.sh validate legion-ci

      - name: Create release bot token
        if: ${{ steps.pending_release.outputs.pending == 'true' }}
        id: release_bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Create the pending GitHub Release
        if: ${{ steps.pending_release.outputs.pending == 'true' }}
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
          RELEASE_TAG: ${{ steps.pending_release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.pending_release.outputs.release_sha }}
          TAG_EXISTS: ${{ steps.pending_release.outputs.tag_exists }}
        run: |
          set -euo pipefail
          args=("$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes)
          if [ "$TAG_EXISTS" = "true" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$RELEASE_SHA")
          fi
          gh release create "${args[@]}"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GitHub Release creation is handled above by the release bot. This
          # keeps release-please focused on maintaining the next Release PR and
          # prevents it from retrying a release which has already been repaired.
          skip-github-release: true
      - name: Enable auto-merge on Release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          pr_number="$(jq -r '.number // empty' <<<"${RELEASE_PR}")"
          if [ -z "${pr_number}" ]; then
            echo "::error::release-please output did not include a PR number"
            exit 1
          fi
          echo "Enabling auto-merge on Release PR #${pr_number}"
          gh pr merge "${pr_number}" --repo "${REPO}" --auto --squash

      # Pull requests opened with GITHUB_TOKEN do not emit pull_request events,
      # so branch-required workflows would otherwise remain action_required.
      # Explicit dispatches attach those checks to the release PR head SHA.
      - name: Dispatch required checks on Release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.number // empty' <<<"${RELEASE_PR}")"
          if [ -z "${pr_number}" ]; then
            echo "::error::release-please output did not include a PR number"
            exit 1
          fi
          head_ref="$(gh pr view "${pr_number}" --repo "${REPO}" --json headRefName --jq '.headRefName')"
          if [ -z "${head_ref}" ]; then
            echo "::error::Release PR #${pr_number} has no head branch"
            exit 1
          fi
          gh workflow run validate.yml --repo "${REPO}" --ref "${head_ref}"
          gh workflow run legion-ci.yml --repo "${REPO}" --ref "${head_ref}"

  publish:
    name: Publish package
    needs: release-please
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://www.npmjs.com/package/@opus-aether-ai/legion-core
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Node for npmjs.com
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use pinned npm
        run: npm install -g npm@12.0.2

      - name: Version is in sync
        id: release_ref
        env:
          GATED_SHA: ${{ needs.release-please.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          bash scripts/install.sh --validate-release-tag="$RELEASE_TAG"
          tag_version="${{ needs.release-please.outputs.version }}"
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$head_sha" != "$GATED_SHA" ] || [ "$tag_sha" != "$GATED_SHA" ]; then
            echo "::error::Gated SHA ${GATED_SHA}, checked-out SHA ${head_sha}, and ${RELEASE_TAG} SHA ${tag_sha} must match"
            exit 1
          fi
          pkg="$(jq -r '.version' package.json)"
          mkt="$(jq -r '.version' .claude-plugin/marketplace.json)"
          if [ "$tag_version" != "$pkg" ]; then
            echo "::error::Tag v${tag_version} does not match package.json ${pkg}"
            exit 1
          fi
          if [ "$pkg" != "$mkt" ]; then
            echo "::error::package.json ($pkg) != marketplace.json ($mkt)"
            exit 1
          fi
          echo "${RELEASE_TAG} resolves to gated SHA ${GATED_SHA}; version ${pkg} is in sync"

      # Upload before registry publication so a transient registry failure cannot
      # leave the newest stable GitHub release without its installer. `--clobber`
      # is safe here because the bytes come from the exact gated release commit.
      - name: Attach installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" scripts/install.sh --clobber

      # npm Trusted Publishing supports private GitHub repositories, but its
      # Sigstore provenance does not. Keep OIDC authentication in both cases and
      # enable provenance only while the source repository is public.
      - name: Publish to npm with visibility-aware provenance
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
        run: npm publish --access public --ignore-scripts --tag latest

      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@opus-aether-ai'
          package-manager-cache: false

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fleet-update:
    name: Notify Legion consumers
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create fleet dispatch token
        id: fleet_bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            legion-code
            nidavellir
            moneyball
            nemesis
            legion-landing
            storefronts
            webapp
            moneyball-product
            factory-ops
          permission-contents: write

      - name: Dispatch the immutable release to every consumer
        env:
          GH_TOKEN: ${{ steps.fleet_bot.outputs.token }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          set -euo pipefail
          consumers=(
            legion-code
            nidavellir
            moneyball
            nemesis
            legion-landing
            storefronts
            webapp
            moneyball-product
            factory-ops
          )
          payload="$(jq -n \
            --arg event_type legion-core-released \
            --arg version "$RELEASE_VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg source_sha "$RELEASE_SHA" \
            '{event_type: $event_type, client_payload: {
              version: $version, tag: $tag, source_sha: $source_sha
            }}')"
          for consumer in "${consumers[@]}"; do
            echo "Dispatching $RELEASE_TAG to Opus-Aether-AI/$consumer"
            gh api --method POST \
              "repos/Opus-Aether-AI/$consumer/dispatches" \
              --input - <<<"$payload"
          done

  recovery-publish:
    name: Recover package publication
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Both checkouts live below GITHUB_WORKSPACE, so its root is not itself a
    # repository. Give every recovery `gh` call an explicit repository target.
    env:
      GH_REPO: ${{ github.repository }}
    environment:
      name: release
      url: https://www.npmjs.com/package/@opus-aether-ai/legion-core
    steps:
      # Recovery controls must come from the revision that defines this trusted
      # workflow. Historical releases are package data only and may predate the
      # validation and required-workflow helpers used below.
      - name: Check out trusted recovery controls
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: control

      - name: Validate release tag before Git uses it as a ref
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash control/scripts/install.sh --validate-release-tag="$RELEASE_TAG"

      - name: Check out immutable release contents
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          path: release

      - name: Verify immutable release tag and versions
        id: recovery_ref
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash control/scripts/verify-release-recovery.sh "$RELEASE_TAG" "$GITHUB_WORKSPACE/release"

      - name: Require validate + legion-ci green for release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.recovery_ref.outputs.sha }}
        run: control/scripts/await-required-workflows.sh validate legion-ci

      # Repair the installer before touching registries. `--clobber` makes a
      # rerun idempotent for this exact validated tag.
      - name: Attach installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release/scripts/install.sh --clobber

      - name: Set up Node for npmjs.com
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use pinned npm
        run: npm install -g npm@12.0.2

      - name: Publish to npm with visibility-aware provenance
        working-directory: release
        env:
          PACKAGE_NAME: ${{ steps.recovery_ref.outputs.package }}
          PACKAGE_VERSION: ${{ steps.recovery_ref.outputs.version }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
        run: |
          set -euo pipefail
          published="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$published" = "$PACKAGE_VERSION" ]; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npmjs; skipping."
          else
            npm publish --access public --ignore-scripts --tag latest
          fi

      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@opus-aether-ai'
          package-manager-cache: false

      - name: Publish to GitHub Packages
        working-directory: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ steps.recovery_ref.outputs.package }}
          PACKAGE_VERSION: ${{ steps.recovery_ref.outputs.version }}
        run: |
          set -euo pipefail
          published="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com 2>/dev/null || true)"
          if [ "$published" = "$PACKAGE_VERSION" ]; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on GitHub Packages; skipping."
          else
            npm publish --registry=https://npm.pkg.github.com --ignore-scripts
          fi
